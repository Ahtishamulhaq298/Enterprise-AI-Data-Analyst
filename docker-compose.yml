services:
  backend:
    build: ./eaida-backend
    ports:
      - "8000:8000"
    env_file:
      - ./eaida-backend/.env
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    build: ./eaida-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage: